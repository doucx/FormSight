<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FormSight" />
    <title>FormSight - 视觉造型构图与色彩感知强化训练系统</title>
    <meta name="description" content="基于视知觉认知与色彩空间建模的自适应视觉与手眼协调强化训练系统" />
    <script>
      (function () {
        try {
          var cachedTheme = localStorage.getItem('formsight_theme_cache') || 'system';
          var isDark =
            cachedTheme === 'dark' ||
            (cachedTheme === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="antialiased min-h-screen">
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
